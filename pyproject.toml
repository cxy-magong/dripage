[project]
name = "dripage"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.3.1",
    "drissionpage>=4.1.1.2",
    "fastapi>=0.104.0",
    "fastapi-proxy-lib>=0.3.0",
    "fastmcp>=2.13.3",
    "httpx>=0.25.0",
    "langchain>=1.2.7",
    "langchain-community>=0.4.1",
    "langchain-core>=1.2.7",
    "langchain-openai>=1.1.7",
    "langchain-runtime>=0.1.1",
    "langgraph>=1.0.7",
    "loguru>=0.7.3",
    "markitdown>=0.1.4",
    "pillow>=12.1.0",
    "psutil>=7.2.1",
    "pyro4>=4.82",
    "pyyaml>=6.0.3",
    "sniffio>=1.3.1",
    "websockets>=12.0",
    "zai-sdk>=0.0.3.4",
    "zhipuai>=2.1.5.20250825",
]

[project.scripts]
dripage-mcp = "mcp_server:main"
cdp-proxy = "cdp_proxy.start_proxy:main"
test-cdp-proxy = "cdp_proxy.test_proxy:main"
chrome-rpc-server = "services.chrome_rpc.start_server:main"
chrome-rpc-client = "services.chrome_rpc.interactive_client:main"
chrome-http-server = "services.chrome_http.server:start_server"
