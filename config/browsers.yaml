# Multi-Browser Configuration
# This file defines multiple browser instances with their configurations.
#
# Each browser is identified by a unique 'name' and references an INI file
# located in config/browser/ directory.
#
# Browser INI files contain detailed browser configuration including:
# - CDP address (port)
# - Chrome browser path
# - User data directory
# - Browser arguments, preferences, flags, etc.
#
# Usage:
#   python -m utils.chrome_manager start --name browser1
#   python -m utils.chrome_manager status --name browser1
#   python -m utils.chrome_manager close --name browser1

browsers:
  # ==================== Internal Browsers (Local) ====================
  # These browsers use INI files in config/browser/ directory

  - name: browser1
    ini_file: config/browser/browser1.ini
    description: "Default browser on port 19222"

  - name: browser2
    ini_file: config/browser/browser2.ini
    description: "Second browser on port 19000"

  # ==================== Worker Browsers (External) ====================
  # These browsers use INI files from external project:
  # G:\code\amazone\copywriting_production\config\dp_conf

  - name: worker_9321
    ini_file: "G:\\code\\amazone\\copywriting_production\\config\\dp_conf\\9321.ini"
    description: "Worker browser on port 9321 (proxy: localhost:8851)"

  - name: worker_9322
    ini_file: "G:\\code\\amazone\\copywriting_production\\config\\dp_conf\\9322.ini"
    description: "Worker browser on port 9322 (proxy: localhost:8851)"

  - name: worker_9323
    ini_file: "G:\\code\\amazone\\copywriting_production\\config\\dp_conf\\9323.ini"
    description: "Worker browser on port 9323 (proxy: localhost:8851)"

  - name: worker_9324
    ini_file: "G:\\code\\amazone\\copywriting_production\\config\\dp_conf\\9324.ini"
    description: "Worker browser on port 9324 (proxy: localhost:8851)"

  - name: worker_9325
    ini_file: "G:\\code\\amazone\\copywriting_production\\config\\dp_conf\\9325.ini"
    description: "Worker browser on port 9325 (proxy: localhost:8851)"

